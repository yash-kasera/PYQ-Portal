<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sem 3 PYQ Portal — AI &amp; DS</title>
<meta name="theme-color" content="#f7f5f0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-mark">III</span>
      <div>
        <h1>Semester 3 PYQ Portal</h1>
        <p>B.Tech · Artificial Intelligence &amp; Data Science</p>
      </div>
    </div>

    <!-- step 1: roll number -->
    <form id="form-roll" class="auth-step" autocomplete="off">
      <label for="in-roll">Enrollment number</label>
      <div class="roll-field">
        <span class="roll-prefix">0201AI2510</span>
        <input id="in-roll" type="text" inputmode="numeric" maxlength="2" placeholder="01" required
               aria-label="Last two digits of your enrollment number">
      </div>
      <p class="hint">Enter the last two digits (01–78).</p>
      <p class="auth-error" id="err-roll" role="alert"></p>
      <button type="submit" class="btn-primary">Next</button>
    </form>

    <!-- step 2: password -->
    <form id="form-pass" class="auth-step" hidden autocomplete="off">
      <div class="who">
        <span id="who-roll"></span>
        <button type="button" id="btn-change-roll" class="linkish">change</button>
      </div>
      <p class="auth-note" id="pass-note"></p>
      <label for="in-pass" id="lbl-pass">Password</label>
      <input id="in-pass" type="password" minlength="6" required autocomplete="current-password">
      <div id="confirm-block" hidden>
        <label for="in-pass2">Confirm password</label>
        <input id="in-pass2" type="password" minlength="6" autocomplete="new-password">
      </div>
      <p class="auth-error" id="err-pass" role="alert"></p>
      <button type="submit" class="btn-primary" id="btn-pass-submit">Sign in</button>
    </form>

    <p class="auth-foot" id="auth-foot"></p>
  </div>
  <p class="made-by auth-made-by">Made by Yash <span class="heart" aria-hidden="true">&lt;3</span></p>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="btn-menu" aria-label="Menu">☰</button>
    <a class="brand" href="#" id="brand-home">
      <span class="brand-mark">III</span>
      <span class="brand-text">PYQ Portal</span>
    </a>
    <nav class="modes" role="tablist">
      <button class="mode-btn is-active" data-mode="pyq" role="tab">Question Bank</button>
      <button class="mode-btn" data-mode="study" role="tab">Short Notes</button>
    </nav>
    <div class="topbar-right">
      <span class="roll-chip" id="roll-chip"></span>
      <button class="icon-btn" id="btn-theme" aria-label="Toggle theme" title="Toggle theme">◐</button>
      <button class="icon-btn" id="btn-logout" aria-label="Sign out" title="Sign out">⏻</button>
    </div>
  </header>

  <div class="shell">
    <!-- ---------- sidebar ---------- -->
    <aside class="sidebar" id="sidebar">
      <div class="side-scroll">
        <section class="side-block">
          <h2 class="side-title">Subject</h2>
          <div id="subject-list" class="subject-list"></div>
        </section>

        <section class="side-block" id="filter-block">
          <h2 class="side-title">Filter</h2>

          <label class="side-label" for="sel-paper">Exam paper</label>
          <select id="sel-paper" class="select"></select>

          <label class="side-label" for="sel-module">Module</label>
          <select id="sel-module" class="select"></select>

          <label class="side-label" for="sel-topic">Topic</label>
          <select id="sel-topic" class="select"></select>

          <label class="side-label" for="sel-status">Status</label>
          <select id="sel-status" class="select">
            <option value="all">All questions</option>
            <option value="unsolved">Unsolved only</option>
            <option value="solved">Solved only</option>
            <option value="remarked">With my remarks</option>
          </select>

          <button id="btn-reset" class="btn-ghost">Reset filters</button>
        </section>

        <section class="side-block" id="progress-block">
          <h2 class="side-title">Progress</h2>
          <div class="progress-rail"><div class="progress-fill" id="progress-fill"></div></div>
          <p class="progress-text" id="progress-text">—</p>
        </section>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- ---------- main ---------- -->
    <main class="main" id="main">

      <!-- PYQ MODE -->
      <div id="view-pyq">
        <div class="main-head">
          <div>
            <h1 class="page-title" id="pyq-title">Question Bank</h1>
            <p class="page-sub" id="pyq-sub"></p>
          </div>
          <div class="view-toggle" role="group" aria-label="View mode">
            <button class="seg is-active" data-view="all">All at once</button>
            <button class="seg" data-view="one">One by one</button>
          </div>
        </div>

        <div class="search-row">
          <input type="search" id="in-search" class="search" placeholder="Search questions…" aria-label="Search questions">
        </div>

        <section class="resources" id="pyq-resources" aria-label="Original question papers"></section>

        <div id="pyq-list"></div>

        <div id="pyq-single" hidden>
          <div class="single-nav">
            <button class="btn-ghost" id="btn-prev">‹ Previous</button>
            <span class="single-count" id="single-count"></span>
            <button class="btn-ghost" id="btn-next">Next ›</button>
          </div>
          <div id="single-holder"></div>
          <div class="single-nav bottom">
            <button class="btn-ghost" id="btn-prev2">‹ Previous</button>
            <button class="btn-ghost" id="btn-next2">Next ›</button>
          </div>
        </div>
      </div>

      <!-- STUDY MODE -->
      <div id="view-study" hidden>
        <div class="main-head">
          <div>
            <h1 class="page-title" id="study-title">Short Notes</h1>
            <p class="page-sub" id="study-sub">Pick a module to read its short notes.</p>
          </div>
        </div>
        <section class="resources" id="study-resources" aria-label="Syllabus"></section>

        <div class="module-grid" id="module-grid"></div>
        <article class="notes" id="notes-body" hidden></article>
      </div>

      <footer class="made-by">Made by Yash <span class="heart" aria-hidden="true">&lt;3</span></footer>
    </main>
  </div>

  <button id="btn-top" class="to-top" aria-label="Back to top" title="Back to top" hidden>
    <span aria-hidden="true">↑</span>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js" crossorigin="anonymous"></script>

<script src="config.js"></script>
<script src="data/syllabus.js"></script>
<script src="data/resources.js"></script>
<script src="data/pyqs-math.js"></script>
<script src="data/pyqs-dsa.js"></script>
<script src="data/pyqs-oop.js"></script>
<script src="data/pyqs-dld.js"></script>
<script src="data/pyqs-eee.js"></script>
<script src="data/solutions-math.js"></script>
<script src="data/solutions-dsa.js"></script>
<script src="data/solutions-oop.js"></script>
<script src="data/solutions-dld.js"></script>
<script src="data/solutions-eee.js"></script>
<script src="data/solutions-eee2.js"></script>
<script src="data/notes-math.js"></script>
<script src="data/notes-dsa.js"></script>
<script src="data/notes-oop.js"></script>
<script src="data/notes-dld.js"></script>
<script src="data/notes-eee.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
